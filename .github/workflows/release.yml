name: release

# On a version tag, check the repo and mirror the public splits to
# https://huggingface.co/datasets/BuddhistAI/buddhist-bench, tagged with the same version.
# Needs a repository secret HF_TOKEN (write access to the BuddhistAI org on Hugging Face).

on:
  push:
    tags: ["v*.*.*"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: python3 scripts/check.py
      - run: python3 scripts/export_hf.py --out build/hf
      - run: pip install "huggingface_hub>=0.24"
      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = "BuddhistAI/buddhist-bench"
          tag = os.environ["TAG"]
          api.create_repo(repo, repo_type="dataset", exist_ok=True)
          api.upload_folder(folder_path="build/hf", repo_id=repo, repo_type="dataset",
                            commit_message=f"Release {tag}", delete_patterns=["data/**"])
          api.create_tag(repo, tag=tag, repo_type="dataset", exist_ok=True)
          PY
